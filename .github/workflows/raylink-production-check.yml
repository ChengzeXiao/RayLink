name: RayLink production checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: raylink-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Build approved protocol Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify metered sing-box Runtime
        run: |
          runtime_directory="${RUNNER_TEMP}/raylink-protocol-runtime"
          sudo bash deploy/build-runtime-artifact.sh \
            1.14.2 \
            "$runtime_directory" \
            amd64
          (
            cd "$runtime_directory"
            sha256sum -c raylink-sing-box-1.14.2-linux-amd64.sha256
          )
      - uses: actions/upload-artifact@v7
        with:
          name: raylink-protocol-runtime-amd64
          path: |
            ${{ runner.temp }}/raylink-protocol-runtime/raylink-sing-box-1.14.2-linux-amd64
            ${{ runner.temp }}/raylink-protocol-runtime/raylink-sing-box-1.14.2-linux-amd64.sha256
            ${{ runner.temp }}/raylink-protocol-runtime/raylink-libcronet-1.14.2-linux-amd64.so
            ${{ runner.temp }}/raylink-protocol-runtime/raylink-libcronet-1.14.2-linux-amd64.so.sha256
          if-no-files-found: error
          retention-days: 1

  production-check:
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: raylink-protocol-runtime-amd64
          path: ${{ runner.temp }}/raylink-protocol-runtime
      - name: Verify downloaded protocol Runtime
        run: |
          runtime_directory="${RUNNER_TEMP}/raylink-protocol-runtime"
          chmod 0755 "$runtime_directory/raylink-sing-box-1.14.2-linux-amd64"
          cp \
            "$runtime_directory/raylink-libcronet-1.14.2-linux-amd64.so" \
            "$runtime_directory/libcronet.so"
          (
            cd "$runtime_directory"
            sha256sum -c raylink-sing-box-1.14.2-linux-amd64.sha256
            sha256sum -c raylink-libcronet-1.14.2-linux-amd64.so.sha256
          )
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax, API, protocol and memory checks
        run: |
          SING_BOX_BIN="${RUNNER_TEMP}/raylink-protocol-runtime/raylink-sing-box-1.14.2-linux-amd64" npm run check:production
