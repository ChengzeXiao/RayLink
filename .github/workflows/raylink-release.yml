name: RayLink multi-architecture release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build approved protocol acceptance Runtime
        run: |
          runtime_directory="${RUNNER_TEMP}/raylink-protocol-runtime"
          sudo bash deploy/build-runtime-artifact.sh \
            1.14.2 \
            "$runtime_directory" \
            amd64
          (
            cd "$runtime_directory"
            sha256sum -c raylink-sing-box-1.14.2-linux-amd64.sha256
            sha256sum -c raylink-libcronet-1.14.2-linux-amd64.so.sha256
          )
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run production acceptance suite
        run: |
          SING_BOX_BIN="${RUNNER_TEMP}/raylink-protocol-runtime/raylink-sing-box-1.14.2-linux-amd64" npm run check:production

  build:
    name: linux-${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          package_version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          requested_version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            requested_version="$package_version"
          fi
          test "$requested_version" = "$package_version"
          printf 'version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"
      - name: Build and natively verify metered sing-box Runtime
        run: |
          sudo bash deploy/build-runtime-artifact.sh \
            1.14.2 \
            web/node/runtime \
            "${{ matrix.arch }}"
      - name: Build checksummed RayLink package, manifest and SPDX SBOM
        env:
          RAYLINK_RELEASE_ARCHES: ${{ matrix.arch }}
        run: |
          install -d -m 0755 output/releases
          bash deploy/package-release.sh \
            "${{ steps.version.outputs.version }}" \
            "output/releases/raylink-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: raylink-linux-${{ matrix.arch }}
          path: |
            output/releases/raylink-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            output/releases/raylink-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256
            output/releases/raylink-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.manifest.json
            output/releases/raylink-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: raylink-linux-*
          path: release-assets
          merge-multiple: true
      - name: Add the one-click installer
        run: install -m 0755 deploy/install.sh release-assets/install.sh
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "RayLink $GITHUB_REF_NAME"
